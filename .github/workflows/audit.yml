name: Dependency Audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        id: audit
        run: |
          if pnpm audit --audit-level=moderate > audit-output.txt 2>&1; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
          cat audit-output.txt

      - name: Open or update tracking issue
        if: steps.audit.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'pnpm audit: advisories detected'
        run: |
          {
            echo "Weekly scheduled \`pnpm audit --audit-level=moderate\` found advisories against dependency versions already shipped on \`main\`."
            echo
            echo '```'
            cat audit-output.txt
            echo '```'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > issue-body.md

          existing=$(gh issue list --state open --json number,title --jq --arg t "$TITLE" '.[] | select(.title == $t) | .number' | head -n1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
          else
            gh issue create --title "$TITLE" --body-file issue-body.md
          fi

      - name: Fail the run so a red check is visible
        if: steps.audit.outputs.found == 'true'
        run: exit 1
